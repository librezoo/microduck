# Creates the `showd` system user and group.
#
# `showd` runs unprivileged. What it needs from the system comes from one group: `robot`, which is
# what lets it talk to `robotd`'s group-writable socket (see showd.service). It never touches a
# joint, a bus or the sound card — it hands "play this" to `robotd`, which owns all three.
u showd - "Show library and playback service" - -
